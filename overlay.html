<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hero — Grid Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; height: 100vh; font-family: system-ui, sans-serif; }
    #bg-layer { position: fixed; inset: 0; z-index: 0; background: #151312; background-size: cover; background-position: center; }
    #canvasContainer { position: fixed; inset: 0; z-index: 1; }
    #canvasContainer img { visibility: hidden; pointer-events: none; position: absolute; }
    #ui { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 100; display: flex; flex-direction: column; gap: 0.6rem; align-items: flex-end; }
    button.ui-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 0.45rem 0.9rem; border-radius: 6px; cursor: pointer; font-size: 0.82rem; backdrop-filter: blur(8px); transition: background 0.2s; white-space: nowrap; }
    button.ui-btn:hover { background: rgba(255,255,255,0.22); }
    input[type=file] { display: none; }
    #settings-panel { background: rgba(10,10,10,0.75); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 1rem; backdrop-filter: blur(14px); width: 240px; display: flex; flex-direction: column; gap: 0.75rem; color: #fff; max-height: 90vh; overflow-y: auto; }
    .panel-section-title { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; opacity: 0.4; margin-top: 0.25rem; }
    .setting-row { display: flex; flex-direction: column; gap: 0.2rem; }
    .setting-row label { display: flex; justify-content: space-between; font-size: 0.78rem; opacity: 0.85; }
    .setting-row input[type=range] { width: 100%; accent-color: #2164EE; cursor: pointer; }
    .color-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.78rem; opacity: 0.85; }
    .color-row input[type=color] { width: 36px; height: 24px; border: none; border-radius: 4px; cursor: pointer; padding: 0; }
    .ratio-btns { display: flex; gap: 0.4rem; margin-top: 0.2rem; }
    .ratio-btn { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); padding: 0.35rem 0; border-radius: 5px; cursor: pointer; font-size: 0.78rem; transition: all 0.15s; }
    .ratio-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .ratio-btn.active { background: #2164EE; border-color: #2164EE; color: #fff; }
    .blend-select { width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 0.35rem 0.5rem; border-radius: 5px; font-size: 0.78rem; cursor: pointer; outline: none; }
    .blend-select option { background: #1a1a1a; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); }
    #save-btn { background: #2164EE; border: none; color: #fff; padding: 0.45rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; transition: opacity 0.2s; width: 100%; margin-top: 0.25rem; }
    #save-btn:hover { opacity: 0.82; }
    .saved-flash { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #2164EE; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; }
    .saved-flash.show { opacity: 1; }
  </style>
</head>
<body>

<div id="bg-layer"></div>
<div id="canvasContainer">
  <img id="heroImg" src="img/hero-png.png" crossorigin="anonymous" alt="">
</div>

<div id="ui">
  <button class="ui-btn" id="toggle-panel">⚙ Réglages</button>
  <div id="settings-panel">

    <div class="panel-section-title">Background</div>
    <div class="color-row">
      <input type="color" id="bg-color" value="#151312">
      <span>Couleur de fond</span>
    </div>
    <div style="display:flex;gap:.5rem">
      <button class="ui-btn" id="upload-bg-btn" style="flex:1;text-align:center;">🖼 Image</button>
      <button class="ui-btn" id="clear-bg-btn" style="flex:1;text-align:center;">✕ Retirer</button>
    </div>
    <input type="file" id="file-bg" accept="image/*">

    <hr>

    <div class="panel-section-title">PNG</div>
    <button class="ui-btn" id="upload-png-btn" style="text-align:center;">📁 Changer le PNG</button>
    <input type="file" id="file-png" accept="image/png,image/*">

    <hr>

    <div class="panel-section-title">Overlay</div>
    <div class="color-row">
      <input type="color" id="overlay-color" value="#2164EE">
      <span>Couleur</span>
    </div>
    <div class="setting-row">
      <label>Opacité <span id="val-opacity">0.85</span></label>
      <input type="range" id="s-opacity" min="0" max="1" step="0.01" value="0.85">
    </div>
    <div class="setting-row">
      <label>Mode de fusion</label>
      <select class="blend-select" id="blend-mode">
        <option value="0" selected>Normal</option>
        <option value="1">Multiply</option>
        <option value="2">Screen</option>
        <option value="3">Overlay</option>
        <option value="4">Color Burn</option>
        <option value="5">Lighten</option>
        <option value="6">Hard Light</option>
      </select>
    </div>
    <div class="setting-row">
      <label>Centre clair <span id="val-centerClear">0.7</span></label>
      <input type="range" id="s-centerClear" min="0" max="1" step="0.01" value="0.7">
    </div>

    <hr>

    <div class="panel-section-title">Grille</div>
    <div class="setting-row">
      <label>Forme des cases</label>
      <div class="ratio-btns">
        <button class="ratio-btn" data-ratio="1">▪ 1:1</button>
        <button class="ratio-btn" data-ratio="2">▬ 2:1</button>
        <button class="ratio-btn active" data-ratio="3">━ 3:1</button>
      </div>
    </div>
    <div class="setting-row">
      <label>Grid <span id="val-grid">16</span></label>
      <input type="range" id="s-grid" min="2" max="200" step="1" value="16">
    </div>
    <div class="setting-row">
      <label>Mouse radius <span id="val-mouse">0.76</span></label>
      <input type="range" id="s-mouse" min="0" max="1" step="0.01" value="0.76">
    </div>
    <div class="setting-row">
      <label>Strength <span id="val-strength">0.93</span></label>
      <input type="range" id="s-strength" min="0" max="1" step="0.01" value="0.93">
    </div>
    <div class="setting-row">
      <label>Relaxation <span id="val-relaxation">0.92</span></label>
      <input type="range" id="s-relaxation" min="0" max="1" step="0.01" value="0.92">
    </div>

    <hr>

    <div class="panel-section-title">Révélation</div>
    <div class="setting-row">
      <label>Durée <span id="val-revealDuration">1000</span>ms</label>
      <input type="range" id="s-revealDuration" min="500" max="8000" step="100" value="1000">
    </div>
    <button class="ui-btn" id="replay-btn" style="text-align:center;width:100%;">↺ Rejouer l'animation</button>

    <hr>

    <div class="panel-section-title">Glitch</div>
    <div class="setting-row">
      <label>Nombre de cases <span id="val-glitch">5</span></label>
      <input type="range" id="s-glitch" min="0" max="5" step="0.1" value="5">
    </div>
    <div class="setting-row">
      <label>Vitesse <span id="val-glitchSpeed">1000</span>ms</label>
      <input type="range" id="s-glitchSpeed" min="50" max="3000" step="50" value="1000">
    </div>

    <button id="save-btn">Sauvegarder les réglages</button>
  </div>
</div>

<div class="saved-flash" id="flash">Réglages sauvegardés ✓</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const STORAGE_KEY = 'hero-overlay-grid-v4';

const vertexShader = `
  varying vec2 vUv;
  void main() {
    vUv = uv;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
  }
`;

// R = reveal (0=overlay plein, 1=image pure) | A = opacité aléatoire par case
const fragmentShader = `
  uniform sampler2D uDataTexture;
  uniform sampler2D uTexture;
  uniform vec4  resolution;
  uniform vec3  uColor;
  uniform float uOpacity;
  uniform int   uBlendMode;
  varying vec2  vUv;

  vec3 applyBlend(vec3 b, vec3 s, float o, int mode) {
    if (mode==1) return mix(b, b*s, o);
    if (mode==2) return mix(b, 1.-(1.-b)*(1.-s), o);
    if (mode==3){ vec3 r=mix(2.*b*s,1.-2.*(1.-b)*(1.-s),step(0.5,b)); return mix(b,r,o); }
    if (mode==4){ vec3 r=clamp(1.-(1.-b)/max(s,0.001),0.,1.); return mix(b,r,o); }
    if (mode==5) return mix(b, max(b,s), o);
    if (mode==6){ vec3 r=mix(2.*b*s,1.-2.*(1.-b)*(1.-s),step(0.5,s)); return mix(b,r,o); }
    return mix(b, s, o); // Normal
  }

  void main() {
    vec2 newUV = (vUv - vec2(0.5)) * resolution.zw + vec2(0.5);
    vec4 img   = texture2D(uTexture, newUV);
    if (img.a < 0.01) { gl_FragColor = vec4(0.); return; }

    vec4  cell   = texture2D(uDataTexture, vUv);
    float reveal = clamp(cell.r, 0.0, 1.0);
    float effOp  = uOpacity * (1.0 - reveal) * cell.a;

    vec3 blended = applyBlend(img.rgb, uColor, effOp, uBlendMode);
    gl_FragColor = vec4(blended, img.a);
  }
`;

const DEFAULTS = {
  grid: 16, mouse: 0.76, strength: 0.93, relaxation: 0.92,
  glitch: 5.0, glitchSpeed: 1000,
  revealDuration: 1000, cellAspect: 3,
  opacity: 0.85, blendMode: 0, centerClear: 0.7,
  overlayColor: '#2164EE', bgColor: '#151312'
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s) return Object.assign({}, DEFAULTS, s);
  } catch(_) {}
  return { ...DEFAULTS };
}

function hexToVec3(hex) {
  return new THREE.Vector3(
    parseInt(hex.slice(1,3),16)/255,
    parseInt(hex.slice(3,5),16)/255,
    parseInt(hex.slice(5,7),16)/255
  );
}

class Sketch {
  constructor(container) {
    this.container      = container;
    this.img            = container.querySelector('img');
    this.width          = container.offsetWidth;
    this.height         = container.offsetHeight;
    this.settings       = loadSettings();
    this.imageAspect    = 1;
    this.mouse          = { x: -99, y: -99 };
    this.glitchSlots    = [];
    this.revealing      = true;
    this.revealStartTime = performance.now();
    this.revealOrder    = [];

    this.renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(this.width, this.height);
    this.renderer.setClearColor(0x000000, 0);
    container.appendChild(this.renderer.domElement);

    this.camera = new THREE.OrthographicCamera(-0.5,0.5,0.5,-0.5,-1000,1000);
    this.camera.position.set(0,0,2);
    this.scene  = new THREE.Scene();

    this.addObjects();
    this.loadImageTexture(this.img.src);
    this.resize();

    window.addEventListener('mousemove', e => {
      this.mouse.x = e.clientX / this.width;
      this.mouse.y = e.clientY / this.height;
    });
    window.addEventListener('resize', this.resize.bind(this));
    this.render();
  }

  regenerateGrid() {
    this.gridW = Math.round(this.settings.grid);
    this.gridH = Math.max(1, Math.round(this.gridW * (this.height / this.width) * this.settings.cellAspect));
    const count = this.gridW * this.gridH;
    const data  = new Float32Array(4 * count);
    for (let i = 0; i < count; i++) {
      data[i*4]   = 0;                           // reveal = 0 → overlay visible
      data[i*4+1] = 0;
      data[i*4+2] = 0;
      data[i*4+3] = 0.4 + Math.random() * 0.6;  // opacité aléatoire par case
    }
    this.dataTexture = new THREE.DataTexture(data, this.gridW, this.gridH, THREE.RGBAFormat, THREE.FloatType);
    this.dataTexture.magFilter = THREE.NearestFilter;
    this.dataTexture.minFilter = THREE.NearestFilter;
    this.dataTexture.needsUpdate = true;
    this.glitchSlots = [];

    // ordre de révélation haut → bas avec jitter
    const jitter = this.gridH * 0.6;
    const order  = [];
    for (let j = 0; j < this.gridH; j++) {
      for (let i = 0; i < this.gridW; i++) {
        order.push({ idx: 4*(i + this.gridW*j), sortKey: (this.gridH-1-j) + Math.random()*jitter });
      }
    }
    order.sort((a,b) => a.sortKey - b.sortKey);
    this.revealOrder = order.map(o => o.idx);

    if (this.material) this.material.uniforms.uDataTexture.value = this.dataTexture;
  }

  startReveal() {
    this.revealing       = true;
    this.revealStartTime = performance.now();
    this.regenerateGrid();
  }

  addObjects() {
    this.regenerateGrid();
    this.material = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      transparent: true,
      uniforms: {
        uTexture:     { value: new THREE.Texture() },
        uDataTexture: { value: this.dataTexture },
        resolution:   { value: new THREE.Vector4(1,1,1,1) },
        uColor:       { value: hexToVec3(this.settings.overlayColor) },
        uOpacity:     { value: this.settings.opacity },
        uBlendMode:   { value: this.settings.blendMode },
      },
      vertexShader, fragmentShader,
    });
    this.plane = new THREE.Mesh(new THREE.PlaneGeometry(1,1), this.material);
    this.scene.add(this.plane);
  }

  loadImageTexture(src) {
    new THREE.TextureLoader().load(src, tex => {
      this.imageAspect = tex.image.height / tex.image.width;
      this.material.uniforms.uTexture.value = tex;
      this.resize();
    });
  }

  resize() {
    this.width  = this.container.offsetWidth;
    this.height = this.container.offsetHeight;
    this.renderer.setSize(this.width, this.height);
    let a1, a2;
    if (this.height/this.width > this.imageAspect) {
      a1=(this.width/this.height)*this.imageAspect; a2=1;
    } else {
      a1=1; a2=(this.height/this.width)/this.imageAspect;
    }
    this.material.uniforms.resolution.value.set(this.width, this.height, a1, a2);
    this.camera.updateProjectionMatrix();
    this.regenerateGrid();
  }

  updateDataTexture() {
    const data = this.dataTexture.image.data;

    // relaxation : reveal revient à 0 → overlay réapparaît
    for (let i = 0; i < data.length; i += 4) {
      data[i] *= this.settings.relaxation;
    }

    // animation de révélation initiale (haut → bas)
    if (this.revealing) {
      const elapsed  = performance.now() - this.revealStartTime;
      const progress = Math.min(elapsed / this.settings.revealDuration, 1.0);
      const total    = this.revealOrder.length;
      const revealed = Math.floor(progress * total);
      // ease-out cubic
      for (let k = 0; k < revealed; k++) {
        const idx = this.revealOrder[k];
        const t   = k / total;
        const ease = 1 - Math.pow(1 - t, 3);
        data[idx] = Math.max(data[idx], ease);
      }
      if (progress >= 1.0) this.revealing = false;
    }

    // centre clair : plancher radial — le centre reste toujours plus révélé
    if (this.settings.centerClear > 0) {
      const cx = (this.gridW - 1) / 2;
      const cy = (this.gridH - 1) / 2;
      for (let i = 0; i < this.gridW; i++) {
        for (let j = 0; j < this.gridH; j++) {
          const dx    = cx > 0 ? (i - cx) / cx : 0;
          const dy    = cy > 0 ? (j - cy) / cy : 0;
          const dist  = Math.sqrt(dx*dx + dy*dy);
          const floor = Math.max(0, 1 - Math.pow(dist * 0.65, 2)) * this.settings.centerClear;
          const idx   = 4*(i + this.gridW*j);
          if (data[idx] < floor) data[idx] = floor;
        }
      }
    }

    // souris : augmente reveal → efface l'overlay
    const gridMouseX = this.gridW * this.mouse.x;
    const gridMouseY = this.gridH * (1 - this.mouse.y);
    const maxDist    = this.gridW * this.settings.mouse;
    const aspect     = (this.height / this.width) * (this.gridW / this.gridH);

    const inRadius = [];
    for (let i = 0; i < this.gridW; i++) {
      for (let j = 0; j < this.gridH; j++) {
        const dist = ((gridMouseX-i)**2)/aspect + (gridMouseY-j)**2;
        if (dist < maxDist**2) {
          const idx       = 4*(i + this.gridW*j);
          const proximity = 1 - Math.sqrt(dist)/maxDist;
          data[idx] = Math.min(data[idx] + this.settings.strength * proximity * 0.12, 1.0);
          inRadius.push(idx);
        }
      }
    }

    // glitch : cases dans le rayon qui résistent au reveal
    const now         = performance.now();
    const glitchCount = Math.round(this.settings.glitch * 10);
    while (this.glitchSlots.length < glitchCount) this.glitchSlots.push({ idx:-1, nextChange:0 });
    this.glitchSlots.length = glitchCount;

    for (const slot of this.glitchSlots) {
      if (now >= slot.nextChange) {
        slot.idx = inRadius.length > 0 ? inRadius[Math.floor(Math.random()*inRadius.length)] : -1;
        const v = this.settings.glitchSpeed * 0.4;
        slot.nextChange = now + this.settings.glitchSpeed + (Math.random()*2-1)*v;
      }
      if (slot.idx >= 0 && inRadius.includes(slot.idx)) {
        data[slot.idx] = 0;
      }
    }

    this.dataTexture.needsUpdate = true;
  }

  render() {
    this.updateDataTexture();
    this.material.uniforms.uColor.value     = hexToVec3(this.settings.overlayColor);
    this.material.uniforms.uOpacity.value   = this.settings.opacity;
    this.material.uniforms.uBlendMode.value = this.settings.blendMode;
    requestAnimationFrame(this.render.bind(this));
    this.renderer.render(this.scene, this.camera);
  }
}

/* ── Init ── */
const sketch = new Sketch(document.getElementById('canvasContainer'));
const bgLayer = document.getElementById('bg-layer');
bgLayer.style.backgroundImage    = "url('img/hero-bg.png')";
bgLayer.style.backgroundSize     = 'cover';
bgLayer.style.backgroundPosition = 'center';

/* ── BG ── */
const bgColorInput = document.getElementById('bg-color');
bgColorInput.value = sketch.settings.bgColor;
bgColorInput.addEventListener('input', () => {
  bgLayer.style.backgroundImage = 'none';
  bgLayer.style.backgroundColor = bgColorInput.value;
  sketch.settings.bgColor = bgColorInput.value;
});
document.getElementById('upload-bg-btn').addEventListener('click', () => document.getElementById('file-bg').click());
document.getElementById('file-bg').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f) return;
  bgLayer.style.backgroundImage=`url(${URL.createObjectURL(f)})`;
  bgLayer.style.backgroundSize='cover'; bgLayer.style.backgroundPosition='center';
  e.target.value='';
});
document.getElementById('clear-bg-btn').addEventListener('click', () => {
  bgLayer.style.backgroundImage='none'; bgLayer.style.backgroundColor=bgColorInput.value;
});

/* ── PNG ── */
document.getElementById('upload-png-btn').addEventListener('click', () => document.getElementById('file-png').click());
document.getElementById('file-png').addEventListener('change', e => {
  const f=e.target.files[0]; if(!f) return;
  sketch.loadImageTexture(URL.createObjectURL(f)); e.target.value='';
});

/* ── Overlay ── */
const overlayColorInput = document.getElementById('overlay-color');
overlayColorInput.value = sketch.settings.overlayColor;
overlayColorInput.addEventListener('input', () => { sketch.settings.overlayColor = overlayColorInput.value; });

const blendSelect = document.getElementById('blend-mode');
blendSelect.value = sketch.settings.blendMode;
blendSelect.addEventListener('change', () => { sketch.settings.blendMode = parseInt(blendSelect.value); });

/* ── Ratio buttons ── */
document.querySelectorAll('.ratio-btn').forEach(btn => {
  if (parseInt(btn.dataset.ratio) === sketch.settings.cellAspect) btn.classList.add('active');
  else btn.classList.remove('active');
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    sketch.settings.cellAspect = parseInt(btn.dataset.ratio);
    sketch.regenerateGrid();
  });
});

/* ── Sliders ── */
[
  { id:'s-grid',           valId:'val-grid',           key:'grid',           regen:true  },
  { id:'s-mouse',          valId:'val-mouse',          key:'mouse',          regen:false },
  { id:'s-strength',       valId:'val-strength',       key:'strength',       regen:false },
  { id:'s-relaxation',     valId:'val-relaxation',     key:'relaxation',     regen:false },
  { id:'s-opacity',        valId:'val-opacity',        key:'opacity',        regen:false },
  { id:'s-centerClear',    valId:'val-centerClear',    key:'centerClear',    regen:false },
  { id:'s-glitch',         valId:'val-glitch',         key:'glitch',         regen:false },
  { id:'s-glitchSpeed',    valId:'val-glitchSpeed',    key:'glitchSpeed',    regen:false },
  { id:'s-revealDuration', valId:'val-revealDuration', key:'revealDuration', regen:false },
].forEach(({ id, valId, key, regen }) => {
  const el  = document.getElementById(id);
  const val = document.getElementById(valId);
  el.value  = sketch.settings[key];
  val.textContent = sketch.settings[key];
  el.addEventListener('input', () => {
    sketch.settings[key] = parseFloat(el.value);
    val.textContent = el.value;
    if (regen) sketch.regenerateGrid();
  });
});

/* ── Replay ── */
document.getElementById('replay-btn').addEventListener('click', () => sketch.startReveal());

/* ── Save ── */
document.getElementById('save-btn').addEventListener('click', () => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sketch.settings));
  const f=document.getElementById('flash');
  f.classList.add('show'); setTimeout(()=>f.classList.remove('show'),1800);
});

/* ── Toggle panel ── */
const panel = document.getElementById('settings-panel');
document.getElementById('toggle-panel').addEventListener('click', () => {
  panel.style.display = panel.style.display==='none' ? 'flex' : 'none';
});
</script>
</body>
</html>
